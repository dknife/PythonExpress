<!DOCTYPE html>
<html>
<head><title>할 일 앱</title></head>
<body>
    <h1>할 일 목록 ({{ tasks|length }}개)</h1>
    <form action="/add" method="post">
        <input type="text" name="task" placeholder="할 일을 입력하세요">
        <button type="submit">추가</button>
    </form>
    <ul>
        {% for task in tasks %}
        <li>{{ task }}
            <a href="/delete/{{ loop.index0 }}">[X]</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
